name: RixuriOS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-and-repro:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc binutils make python3 qemu-system-x86 ovmf \
            mtools dosfstools xorriso gcc-x86-64-linux-gnu \
            gcc-mingw-w64-x86-64

      - name: Record toolchain
        run: |
          mkdir -p build/ci
          {
            gcc --version | head -n1
            x86_64-linux-gnu-gcc --version | head -n1
            ld --version | head -n1
            qemu-system-x86_64 --version | head -n1
            mcopy --version | head -n1
            mkfs.fat --version 2>&1 | head -n1
            xorriso --version | head -n1
            python3 --version
            make --version | head -n1
          } | tee build/ci/toolchain.txt

      - name: Strict host suite and ABI check
        env:
          CROSS: x86_64-linux-gnu-
          HOST_CC: gcc
        run: make test abi-check

      - name: Reproducible artifact check
        env:
          CROSS: x86_64-linux-gnu-
          HOST_CC: gcc
          SOURCE_DATE_EPOCH: 1700000000
        run: bash scripts/repro-check.sh

      - name: Publish provenance and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rixurios-ci-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/provenance.json
            build/ci/**
            build/test-logs/**
            build/repro-a/**
            build/repro-b/**
