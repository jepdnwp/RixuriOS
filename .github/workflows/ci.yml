name: RixuriOS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rixurios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils make mingw-w64 dosfstools mtools qemu-system-x86 ovmf

      - name: Verify required tools
        run: |
          command -v gcc
          command -v ld
          command -v x86_64-w64-mingw32-gcc
          command -v qemu-system-x86_64
          test -f /usr/share/OVMF/OVMF_CODE_4M.fd || test -f /usr/share/OVMF/OVMF_CODE.fd || test -f /usr/share/edk2/ovmf/OVMF_CODE.fd

      - name: Build kernel
        run: make CROSS= all

      - name: Validate ELF artifact
        run: |
          test -s build/kernel.elf
          readelf -h build/kernel.elf
          readelf -l build/kernel.elf
          readelf -h build/kernel.elf | grep -F 'Class:                             ELF64'
          readelf -h build/kernel.elf | grep -F 'Machine:                           Advanced Micro Devices X86-64'

      - name: Build UEFI ESP
        run: bash scripts/build-uefi.sh

      - name: Validate ESP
        run: |
          test -s build/uefi/esp/EFI/BOOT/BOOTX64.EFI
          test -s build/uefi/esp/kernel.elf
          test -s build/uefi/esp.img
          file build/uefi/esp/EFI/BOOT/BOOTX64.EFI

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rixurios-build-${{ github.sha }}
          path: |
            build/kernel.elf
            build/uefi/esp.img
            build/uefi/esp/EFI/BOOT/BOOTX64.EFI

  qemu:
    name: UEFI boot in QEMU
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QEMU and UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf dosfstools mtools gcc binutils make mingw-w64

      - name: Build test image
        run: |
          make CROSS= all
          bash scripts/build-uefi.sh

      - name: Boot RixuriOS with QEMU
        run: |
          set +e
          timeout --signal=TERM --kill-after=5s 25s bash scripts/run-qemu.sh > qemu.log 2>&1
          status=$?
          set -e
          cat qemu.log
          if [ "$status" -ne 124 ]; then
            echo "QEMU exited before the expected timeout (status=$status)"
            exit 1
          fi

      - name: Validate real boot milestones
        run: |
          grep -F 'RixuriOS kernel: x86_64 / AMD64 64-bit' qemu.log
          grep -F 'Boot handoff: version=' qemu.log
          grep -F 'GDT: initialized' qemu.log
          grep -F 'IDT: initialized' qemu.log
          grep -F 'PMM: total=' qemu.log
          grep -F 'VMM: early identity map active' qemu.log
          grep -F 'KHEAP: initialized' qemu.log
          grep -F 'LAPIC: initialized' qemu.log
          if grep -Eiq 'panic|triple fault|fatal|segmentation fault|invalid opcode' qemu.log; then
            echo 'QEMU log contains a fatal kernel diagnostic'
            exit 1
          fi

      - name: Upload QEMU log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rixurios-qemu-${{ github.sha }}
          path: qemu.log
