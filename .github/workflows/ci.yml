name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc x86_64-linux-gnu-gcc binutils x86_64-linux-gnu-binutils \
            gcc-mingw-w64-x86-64 qemu-system-x86 ovmf mtools dosfstools xorriso python3 make
      - name: Host suite
        run: make test CROSS=x86_64-linux-gnu- HOST_CC=gcc
      - name: Image
        run: make image CROSS=x86_64-linux-gnu-
      - name: Fast QEMU subset
        run: |
          timeout 120 python3 scripts/qemu_pipe_stress_test.py
          timeout 120 python3 scripts/qemu_crash_test.py
          timeout 150 python3 scripts/qemu_fuzz_test.py
      - name: Reproducibility probe (kernel ELF)
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          make clean
          make all CROSS=x86_64-linux-gnu- HOST_CC=gcc
          sha256sum build/kernel.elf > /tmp/a.sha
          make clean
          make all CROSS=x86_64-linux-gnu- HOST_CC=gcc
          sha256sum build/kernel.elf > /tmp/b.sha
          diff /tmp/a.sha /tmp/b.sha
