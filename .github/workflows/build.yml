name: RixuriOS build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-x86-64-linux-gnu binutils-x86-64-linux-gnu gcc-mingw-w64-x86-64 dosfstools mtools qemu-system-x86 ovmf
      - name: Build kernel
        run: make CROSS=x86_64-linux-gnu- all
      - name: Inspect ELF
        run: make CROSS=x86_64-linux-gnu- check
      - name: Build UEFI image
        run: bash ./scripts/build-uefi.sh
      - name: Verify image contents
        run: |
          test -s build/kernel.elf
          test -s build/uefi/esp/kernel.elf
          test -s build/uefi/esp/EFI/BOOT/BOOTX64.EFI
          test -s build/uefi/esp.img
      - name: Boot QEMU smoke test
        timeout-minutes: 2
        run: |
          set +e
          timeout 45s bash ./scripts/run-qemu.sh > build/qemu.log 2>&1
          rc=$?
          set -e
          cat build/qemu.log
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then exit "$rc"; fi
          grep -q 'RIXURI:KERNEL_READY' build/qemu.log
